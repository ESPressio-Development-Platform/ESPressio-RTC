name: Native RTC contract tests
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Platform
          ref: main
          path: ESPressio-Platform
      - run: PLATFORM_SRC="$GITHUB_WORKSPACE/ESPressio-Platform/src" ./tests/run_native_tests.sh
